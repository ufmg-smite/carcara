# Custom SMT-LIB operators, loaded by the `custom_operators!` macro at compile time.
#
# Each operator is declared with `[[operator]]`, `name`, `return_type`, and optional `arg_types`
# (defaults to `[]` for nullary operators).
#
# Supported sorts are: Bool, Int, Real, String, RegLan, UnitTuple, and applications of Array, Set
# and Tuple, written as lists (e.g. `(Set Int)` is written as `["Set", "Int"]`).
#
# Operators can also declare sort parameters in `params`, which can be used in the other sorts.
#
# The entries below are real cvc5 string extensions carcara doesn't implement as built-ins, see
# https://cvc5.github.io/docs/cvc5-1.0.2/theories/strings.html

[[operator]]
name = "str.rev"
return_type = "String"
arg_types = ["String"]

[[operator]]
name = "str.to_lower"
return_type = "String"
arg_types = ["String"]

[[operator]]
name = "str.to_upper"
return_type = "String"
arg_types = ["String"]

[[operator]]
name = "str.update"
return_type = "String"
arg_types = ["String", "Int", "String"]
