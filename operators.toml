# Operators definitions, loaded by the `extend_operator_enum` macro at compile time. Not all
# operators supported by Carcara can be represented here with a fixed signature, so some are
# hand-written in `enum Operator`.
#
# Each operator is declared with `[[operator]]`, `name`, `return_type`, and optional `arg_types`
# (defaults to `[]` for nullary operators).
#
# Each operator then becomes a variant of `enum Operator`, named after `name` in PascalCase (e.g.
# `str.to_lower` becomes `StrToLower`). You can set the optional `variant` key to choose the variant
# name explicitly.
#
# Supported sorts are: Bool, Int, Real, String, RegLan, UnitTuple, BitVec, and applications of
# Array, Set and Tuple, written as lists (e.g. `(Set Int)` is written as `["Set", "Int"]`).
#
# `BitVec` matches a bitvector of any width, but all occurrences of `BitVec` in an operator must
# have the same width.
#
# Operators can also declare sort parameters in `params`, which can be used in the other sorts.
#
# Operators can be made n-ary by setting `nary` to one of the SMT-LIB attributes `left-assoc`,
# `right-assoc`, `chainable` or `pairwise`. N-ary operators must have exactly two identical
# `arg_types`, and accept two or more arguments of that sort.

# Core operators

