# Extra SMT-LIB operators, loaded by the `extend_operator_enum` macro at compile time.
#
# Each operator is declared with `[[operator]]`, `name`, `return_type`, and optional `arg_types`
# (defaults to `[]` for nullary operators).
#
# Supported sorts are: Bool, Int, Real, String, RegLan, UnitTuple, and applications of Array, Set
# and Tuple, written as lists (e.g. `(Set Int)` is written as `["Set", "Int"]`).
#
# Operators can also declare sort parameters in `params`, which can be used in the other sorts.
#
# Every operator here is a cvc5 extension to SMT-LIB. Standard SMT-LIB operators are built-ins,
# in `enum Operator`.

# Integer operators

[[operator]]
name = "int.pow2"
return_type = "Int"
arg_types = ["Int"]

[[operator]]
name = "int.log2"
return_type = "Int"
arg_types = ["Int"]

[[operator]]
name = "int.ispow2"
return_type = "Bool"
arg_types = ["Int"]

